apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-aluno-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-aluno
  template:
    metadata:
      labels:
        app: data-aluno
    spec:
      containers:
        - name: data-aluno
          image: brenojansen/data-aluno:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
